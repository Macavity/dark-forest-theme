name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0). Must already exist.'
        required: true

permissions:
  contents: write  # required to create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
            TAG="${TAG#v}"
          fi
          MANIFEST_VERSION="$(jq -r .version theme.json)"
          PACKAGE_VERSION="$(jq -r .version package.json)"
          echo "Tag (without v):     $TAG"
          echo "theme.json:          $MANIFEST_VERSION"
          echo "package.json:        $PACKAGE_VERSION"
          if [ "$TAG" != "$MANIFEST_VERSION" ] || [ "$TAG" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag and manifest versions disagree. Run \`bun run version:bump\` and re-tag."
            exit 1
          fi

      - name: Validate manifest against schema
        run: bun run validate

      - name: Build dist/
        run: bun run build

      - name: Build zip
        run: bun run build:zip

      - name: Show zip contents
        run: unzip -l dark-forest-*.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dark-forest-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
